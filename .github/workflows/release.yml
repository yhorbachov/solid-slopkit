# Publishes every @solid-slopkit package as one GitHub Release (ADR 0001). The packages share one version, which
# `pnpm changeset version` sets from the pending changesets. Commit that, then push a tag named v<version>, e.g.
# `git tag v0.2.0 && git push origin v0.2.0`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node from mise.toml; pnpm 12 to match the lockfile.
      - uses: jdx/mise-action@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the packages' version, with no changesets left unapplied
        run: |
          version=$(node -e "import('./scripts/packages.mjs').then((m) => console.log(m.sharedVersion()))")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the packages' version $version"
            exit 1
          fi
          if ls .changeset/*.md | grep -v README.md; then
            echo "These changesets are not applied yet: run pnpm changeset version and commit the result"
            exit 1
          fi

      - run: pnpm format:check
      - run: pnpm lint
      # Builds and packs every package first: forms' tests import @solid-slopkit/ui through its built exports.
      - run: pnpm release:pack
      - run: pnpm -r --filter "./packages/*" typecheck
      # The browser test projects run in Chromium. The runner has no GPU, so WebGL and WebGPU draw through SwiftShader
      # (see packages/threejs/vite.config.ts).
      - run: pnpm --filter @solid-slopkit/ui exec playwright install --with-deps chromium
      - run: pnpm test
      # The docs site is a real consumer of the built packages: its production build resolves each @solid-slopkit
      # package through its exports.
      - run: pnpm --filter docs build
      # After the build: the docs' route types (file-routes.d.ts) are generated by it.
      - run: pnpm --filter docs typecheck

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs > release-notes.md
          gh release create "$GITHUB_REF_NAME" release/*.tgz --title "$GITHUB_REF_NAME" --notes-file release-notes.md
